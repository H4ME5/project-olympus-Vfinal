name: Live Tournament Update
 
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install numpy
 
      - name: Run live updater
        id: updater
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python update_results.py
          if [ -f olympus_live.json ]; then
            AGE=$(( $(date +%s) - $(date -r olympus_live.json +%s) ))
            if [ $AGE -lt 30 ]; then
              echo "updated=true" >> $GITHUB_OUTPUT
            else
              echo "updated=false" >> $GITHUB_OUTPUT
            fi
          fi
 
      - name: Commit if updated
        if: steps.updater.outputs.updated == 'true'
        run: |
          git config user.name  "Olympus Bot"
          git config user.email "bot@projectolympus"
          git add olympus_live.json
          git diff --staged --quiet || git commit -m "Live update $(date -u '+%H:%M:%S UTC')"
          git push
